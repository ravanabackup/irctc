  ac(){ if(!this.enabled||typeof window==='undefined') return null;
    try{

      if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});

    }catch(e){ return null; } },
  tone(freq,dur,type,vol,delay,slide){ const ctx=this.ac(); if(!ctx) return;
    try{ const now=ctx.currentTime+(delay||0); const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,now);
      if(slide) o.frequency.exponentialRampToValueAtTime(slide,now+dur);
      g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(vol||0.07,now+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
      o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now+dur+0.03);
    }catch(e){} },

/* ---------------- RAILWAY MATH HELPERS ---------------- */
function fmtDur(min){ return pad2(Math.floor(min/60))+'h '+pad2(min%60)+'m'; }
function addMins(t,mins){ const p=t.split(':'); const tot=(+p[0])*60+(+p[1])+mins; const h=Math.floor((tot%1440)/60), m=tot%60, d=Math.floor(tot/1440); const b=pad2(h)+':'+pad2(m); return d>0?b+' (+'+d+'d)':b; }
function hashSeed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); }
function buildAvail(cc,km,ty,quota,diff,seed,idx){
  const rate={'1A':3.65,'2A':2.15,'3A':1.48,CC:1.85,SL:0.58};
  const mult=(ty==='RAJDHANI'||ty==='VANDE_BHARAT')?1.18:(ty==='SHATABDI'||ty==='DURONTO')?1.12:1.0;
  const base=Math.max(cc==='SL'?195:495, Math.round((km*rate[cc]*mult)/5)*5);
  const tat=quota==='CK'?(cc==='SL'?Math.min(200,Math.max(100,Math.round(base*.3))):cc==='CC'?Math.min(225,Math.max(125,Math.round(base*.3))):Math.min(500,Math.max(300,Math.round(base*.3)))):0;
  const sf=cc==='SL'?30:45, res=cc==='1A'?60:cc==='2A'?50:cc==='SL'?20:40;
  const roll=(seed+idx*17+cc.charCodeAt(0)*13)%100;
  let st='AVAILABLE',ct=24,prob;
  if(quota==='CK'){
    if(diff==='HARDCORE'){
      if(idx===0&&(cc==='3A'||cc==='2A'||cc==='CC'||cc==='SL')){st='AVAILABLE';ct=6+(roll%11);}
      else if(roll<32){st='AVAILABLE';ct=4+(roll%14);} else if(roll<54){st='RAC';ct=3+(roll%9);}
      else if(roll<82){st='WL';ct=14+(roll%52);prob=Math.max(28,84-Math.floor(ct*.8));} else{st='REGRET';ct=0;}
    }else if(diff==='RUSH'){
      if(idx===0){st='AVAILABLE';ct=16+(roll%22);}
      else if(roll<48){st='AVAILABLE';ct=9+(roll%28);} else if(roll<70){st='RAC';ct=4+(roll%14);}
      else if(roll<90){st='WL';ct=8+(roll%45);prob=Math.max(42,88-Math.floor(ct*.7));} else{st='REGRET';ct=0;}
    }else{
      if(idx===0||roll<62){st='AVAILABLE';ct=22+(roll%36);} else if(roll<80){st='RAC';ct=5+(roll%12);}
      else if(roll<94){st='WL';ct=6+(roll%30);prob=76;} else{st='REGRET';ct=0;}
    }
  }else{
    if(idx===0||roll<64){st='AVAILABLE';ct=28+(roll%56);} else if(roll<80){st='RAC';ct=6+(roll%16);}
    else if(roll<95){st='WL';ct=12+(roll%70);prob=Math.max(35,92-Math.floor(ct*.6));} else{st='REGRET';ct=0;}
  }
  return {cc:cc,st:st,ct:ct,prob:prob,base:base,tat:tat,sf:sf,res:res};
}
function genTrains(from,to,quota,diff,dateStr){
  const seed=hashSeed(from.code+'-'+to.code+'-'+dateStr+'-'+quota), out=[];
  const match=CURATED.filter(t=>t.rt.some(r=>r[0]===from.code&&r[1]===to.code));
  match.forEach((t,idx)=>{ out.push({no:t.no,nm:t.nm,ty:t.ty,fc:from.code,fn:from.name,tc:to.code,tn:to.name,dep:t.dep,arr:addMins(t.dep,t.dur),dur:fmtDur(t.dur),durMin:t.dur,km:t.km,days:t.days,pan:t.pan,cls:t.cl.map(c=>buildAvail(c,t.km,t.ty,quota,diff,seed,idx))}); });
  const target=Math.max(4,match.length);
  const fb=[{p:from.city+' - '+to.city+' Garib Rath / AC Express',ty:'SUPERFAST',cl:['1A','2A','3A','SL'],sp:76,dep:'16:15'},{p:to.city+' Duronto Superfast',ty:'DURONTO',cl:['1A','2A','3A','SL'],sp:84,dep:'20:40'},{p:from.city+' - '+to.city+' Vande Bharat Express',ty:'VANDE_BHARAT',cl:['CC','1A'],sp:96,dep:'06:10'},{p:from.city+' Mail Express',ty:'SUPERFAST',cl:['2A','3A','SL'],sp:62,dep:'22:30'},{p:from.city+' - '+to.city+' Sampark Kranti',ty:'SUPERFAST',cl:['1A','2A','3A','SL'],sp:72,dep:'13:20'}];
  const baseD=match.length>0?match[0].km:420+(seed%1450);
  let fi=0;
  while(out.length<target&&fi<fb.length){ const f=fb[fi]; if(f.ty==='VANDE_BHARAT'&&baseD>850){fi++;continue;}
    const num=String(12000+((seed+fi*313)%980)); const dm=Math.round((baseD/f.sp)*60); const idx=out.length;
    out.push({no:num,nm:f.p,ty:f.ty,fc:from.code,fn:from.name,tc:to.code,tn:to.name,dep:f.dep,arr:addMins(f.dep,dm),dur:fmtDur(dm),durMin:dm,km:baseD,days:['M','T','W','T','F','S','S'],pan:baseD>500,cls:f.cl.map(c=>buildAvail(c,baseD,f.ty,quota,diff,seed+91,idx))});
    fi++; }
  return out;
}
function calcFare(av,n,ins){ n=Math.max(1,n); const sub=av.base*n, tt=av.tat*n, sr=(av.sf+av.res)*n;
  const conv=av.cc==='SL'?15:30; const subG=sub+tt+sr;
  const gst=av.cc==='SL'?Math.round(conv*.18):Math.round(subG*.05+conv*.18);
  const insT=ins?Number((0.45*n).toFixed(2)):0;
  const grand=Number((sub+tt+sr+conv+gst+insT).toFixed(2));
  return {n:n,sub:sub,tt:tt,sr:sr,conv:conv,gst:gst,ins:insT,grand:grand};

const CCH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789abcdefghijkmnpqrstuvwxyz';
function genCaptcha(n){ n=n||6; let s=''; for(let i=0;i<n;i++) s+=CCH[Math.floor(Math.random()*CCH.length)]; return s; }
function drawCaptcha(canvasId,code,compact){
  const cv=$(canvasId); if(!cv) return; const ctx=cv.getContext('2d'); if(!ctx) return;
  const w=cv.width,h=cv.height;
  const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#0f2544'); g.addColorStop(.5,'#1b365d'); g.addColorStop(1,'#10213a');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  for(let x=0;x<w;x+=18){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+8,h); ctx.stroke(); }
  for(let y=0;y<h;y+=14){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  for(let i=0;i<5;i++){ ctx.strokeStyle=i%2===0?'rgba(245,158,11,0.36)':'rgba(148,163,184,0.35)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(0,Math.random()*h); ctx.bezierCurveTo(w*.3,Math.random()*h,w*.7,Math.random()*h,w,Math.random()*h); ctx.stroke(); }
  const sp=(w-28)/code.length, pal=['#ffffff','#fde68a','#f8fafc','#fbbf24','#e2e8f0'];
  for(let i=0;i<code.length;i++){ ctx.save(); const x=18+i*sp+(Math.random()*4-2), y=h/2+(Math.random()*10-5);
    ctx.translate(x,y); ctx.rotate((Math.random()-.5)*.52);
    ctx.font="700 "+(compact?24:28)+"px 'JetBrains Mono',monospace"; ctx.textBaseline='middle';
    ctx.fillStyle=pal[(i+Math.floor(Math.random()*2))%pal.length]; ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=3;
    ctx.fillText(code[i],0,0); ctx.restore(); }
  for(let i=0;i<65;i++){ ctx.fillStyle=Math.random()>.5?'rgba(255,255,255,0.22)':'rgba(245,158,11,0.25)'; ctx.fillRect(Math.random()*w,Math.random()*h,1.8,1.8); }
}

/* ---------------- QR SVG generator (deterministic 21x21) ---------------- */
function qrSVG(value,size){
  size=size||148; const dim=21, m=[]; for(let r=0;r<dim;r++){ m.push([]); for(let c=0;c<dim;c++) m[r].push(false); }
  function finder(r0,c0){ for(let r=0;r<7;r++) for(let c=0;c<7;c++){ const o=(r===0||r===6||c===0||c===6), inn=(r>=2&&r<=4&&c>=2&&c<=4); m[r0+r][c0+c]=o||inn; } }
  finder(0,0); finder(0,dim-7); finder(dim-7,0);
  for(let i=8;i<dim-8;i++){ m[6][i]=i%2===0; m[i][6]=i%2===0; }
  let h=2166136261; for(let i=0;i<value.length;i++){ h^=value.charCodeAt(i); h=Math.imul(h,16777619); }
  for(let r=0;r<dim;r++) for(let c=0;c<dim;c++){ const tl=r<8&&c<8, tr=r<8&&c>=dim-8, bl=r>=dim-8&&c<8, tm=(r===6||c===6); if(tl||tr||bl||tm) continue; h=Math.imul(h^(r*31+c*17),16777619); m[r][c]=Math.abs(h)%100>45; }
  let rects=''; for(let r=0;r<dim;r++) for(let c=0;c<dim;c++) if(m[r][c]) rects+='<rect x="'+c+'" y="'+r+'" width="1" height="1" fill="#0f172a"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 21 21" class="rounded-lg bg-white p-2 shadow-md" shape-rendering="crispEdges" role="img"><rect width="21" height="21" fill="#ffffff"/>'+rects+'</svg>';
}

      setTimeout(()=>{ Sound.tatkalOpen();
        const maxS=DIFF[S.difficulty].sec;
        S.slot={train:tr,cc:av.cc,av:JSON.parse(JSON.stringify(av)),locked:Date.now()};
        S.maxSec=maxS; S.remSec=maxS; S.bookingStart=Date.now(); S.payStart=0; S.paxSplit=0;
        S.pax=[{id:'p'+Date.now(),name:'',age:'',gender:'MALE',berth:'NO_PREF',food:'VEG'}];
        S.mobile='9876543210'; S.ins=true; S.liveBerths=av.st==='AVAILABLE'?av.ct:8;
        S.hicLeft=DIFF[S.difficulty].hic; S.srvOpen=false; S.srvN=0; S.capMiss=0; S.hurdleSec=0; S.hurdleStart=null;
        S.dCap=genCaptcha(6); S.fareSheet=false;
        go('PASSENGER');
      },450);
    });
  }
  paint();
  // Live drain loop
  const baseMs=S.criteria.quota==='CK'?DIFF[S.difficulty].drain:DIFF[S.difficulty].drain*2.5;
  INT.drain=setInterval(()=>{
    S.liveTicks++;
    S.trains.forEach(tr=>{ tr.cls.forEach(x=>{
      if(Math.random()>0.42) return;
      if(x.st==='AVAILABLE'){ const stp=S.difficulty==='HARDCORE'?3:S.difficulty==='RUSH'?2:1; const nx=x.ct-stp;
        if(nx>0) x.ct=nx; else {x.st='RAC';x.ct=2;} }
      else if(x.st==='RAC'){ const nx=x.ct+2; if(nx<=18) x.ct=nx; else {x.st='WL';x.ct=4;x.prob=78;} }
      else if(x.st==='WL'){ const nx=x.ct+(S.difficulty==='HARDCORE'?7:4); if(nx>120){x.st='REGRET';x.ct=0;} else {x.ct=nx;x.prob=Math.max(18,(x.prob||70)-3);} }
    });});
    paint();
  },baseMs);
}

/* ================= SESSION TIMER (D + E) ================= */
function startSession(){
  if(INT.session) clearInterval(INT.session);
  INT.session=setInterval(()=>{
    if(S.screen!=='PASSENGER'&&S.screen!=='PAYMENT'){ clearInterval(INT.session); delete INT.session; return; }
    S.remSec=Math.max(0,S.remSec-1);
    if(S.remSec>0&&S.remSec<=15) Sound.urgentTick();
    const el=$('sess-clock'); if(el){ el.textContent=pad2(Math.floor(S.remSec/60))+':'+pad2(S.remSec%60);
      el.className='rounded-xl px-3.5 py-1.5 font-mono text-xl font-extrabold tabular-nums '+(S.remSec<=25?'bg-red-500 text-white':S.remSec<=60?'bg-amber-500 text-slate-950':'bg-[#1b365d] text-amber-300'); }
    const bar=$('sess-bar'); if(bar){ bar.style.width=Math.max(0,Math.min(100,(S.remSec/S.maxSec)*100))+'%'; bar.className='h-full transition-all duration-1000 ease-linear '+(S.remSec<=25?'bg-red-500':S.remSec<=60?'bg-amber-500':'bg-emerald-500'); }
    const box=$('sess-box'); if(box&&S.remSec<=25){ box.className='mb-5 overflow-hidden rounded-2xl border p-4 shadow-md transition animate-urgent-pulse border-red-500/60 bg-red-500/10'; }
    const el2=$('pay-clock'); if(el2){ el2.innerHTML='<i data-lucide="clock" class="h-4 w-4"></i>'+pad2(Math.floor(S.remSec/60))+':'+pad2(S.remSec%60); el2.className='flex items-center gap-1.5 rounded-xl px-3 py-1.5 font-mono text-base font-extrabold tabular-nums '+(S.remSec<=25?'bg-red-600 text-white':'bg-[#1b365d] text-amber-300'); refreshIcons(); }
    const el3=$('sess-clock2'); if(el3){ el3.textContent=S.remSec+'s left'; }
    if(S.remSec<=0){ clearInterval(INT.session); delete INT.session; sessionTimeoutFail(); }
  },1000);
}
function sessionTimeoutFail(){
  if(!S.slot) return; Sound.fail();
  const preset=DIFF[S.difficulty]; const total=(Date.now()-S.bookingStart)/1000;
  const fare=S.fare||calcFare(S.slot.av,Math.max(1,S.pax.length),true);
  S.result={ok:false,reason:'TIMEOUT',head:'Session Timed Out — Tatkal Quota Exhausted!',detail:'Your '+S.maxSec+'s reservation lock expired before payment completed. Rival Tatkal contenders filled '+S.slot.cc+' berths in '+preset.rival+'s!',train:S.slot.train,cc:S.slot.cc,quota:S.criteria.quota,date:S.criteria.date,seats:[],fare:fare,m:{total:total,pax:S.paxSplit||total,hurdle:S.hurdleSec,pay:S.payStart>0?(Date.now()-S.payStart)/1000:0,srv:S.srvN,cap:S.capMiss,rival:preset.rival},at:new Date().toLocaleTimeString()};
  S.streak=0; S.history.unshift({id:'h'+Date.now(),train:S.slot.train.no+' '+S.slot.train.nm,route:S.slot.train.fc+' → '+S.slot.train.tc,quota:S.criteria.quota,cls:S.slot.cc,ok:false,secs:total,fare:fare.grand,at:new Date().toLocaleTimeString()});
  go('RESULT');
}

    document.querySelectorAll('.rmbtn').forEach(b=>b.onclick=()=>{ if(S.pax.length<=1) return; Sound.click(); S.pax=S.pax.filter(x=>x.id!==b.getAttribute('data-rm')); paint(); });
    const add=$('d-add'); if(add) add.onclick=()=>{ if(S.pax.length>=4) return; Sound.click(); S.pax.push({id:'p'+Date.now()+Math.floor(Math.random()*999),name:'',age:'',gender:'MALE',berth:'NO_PREF',food:'VEG'}); paint(); };
    document.querySelectorAll('.mfbtn').forEach(b=>b.onclick=()=>{ const mp=S.master.find(x=>x.id===b.getAttribute('data-mf')); if(!mp) return; Sound.click(); hideErr();
      const bi=S.pax.findIndex(p=>p.name.trim()==='');
      const mapped={id:'p'+Date.now()+Math.floor(Math.random()*999),name:mp.name,age:String(mp.age),gender:mp.gender,berth:mp.berth,food:mp.food};
      if(bi>=0) S.pax[bi]=mapped; else if(S.pax.length<4) S.pax.push(mapped);
      paint();
    });
    const fa=$('d-fillall'); if(fa) fa.onclick=()=>{ if(S.master.length===0) return; Sound.tatkalOpen(); hideErr(); S.pax=S.master.slice(0,4).map((x,i)=>({id:'p'+Date.now()+i,name:x.name,age:String(x.age),gender:x.gender,berth:x.berth,food:x.food})); paint(); };
    $('d-mobile').oninput=(e)=>{ S.mobile=e.target.value.replace(/\D/g,'').slice(0,10); e.target.value=S.mobile; };
    $('d-ins').onchange=(e)=>{ S.ins=e.target.checked; paint(); };
    $('d-refresh').onclick=()=>{ Sound.click(); S.dCap=genCaptcha(6); drawCaptcha('d-captcha',S.dCap,true); $('d-capin').value=''; };

    $('d-sheet').onclick=()=>{ Sound.click(); S.fareSheet=!S.fareSheet; paint(); };

      if(S.hicLeft>0){ triggerHiccup(true); return; }
      Sound.click(); proceedPay();
    };
  }
  paint(); startSession();
  if(INT.berth) clearInterval(INT.berth);

  };

  }
  window.__triggerHiccup=triggerHiccup;
}

    return '<tr class="bg-white dark:bg-[#111b2d]"><td class="px-4 py-3 font-mono font-bold text-slate-500">'+(i+1)+'</td><td class="px-4 py-3 font-bold text-slate-900 dark:text-white">'+esc(s.nm)+'</td><td class="px-4 py-3 font-mono text-slate-600 dark:text-slate-300">'+s.age+' / '+s.g[0]+'</td><td class="px-4 py-3 text-slate-600 dark:text-slate-300">'+esc(s.food.replace('_',' '))+'</td><td class="px-4 py-3"><span class="inline-block rounded-md px-2.5 py-1 font-mono text-xs font-extrabold '+(cnf?'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400':rac?'bg-amber-500/15 text-amber-700 dark:text-amber-300':'bg-red-500/15 text-red-600 dark:text-red-400')+'">'+esc(s.st)+'</span></td></tr>'; }).join('');
  m.innerHTML='<div class="mx-auto max-w-5xl px-3 py-5 sm:px-6 sm:py-8">'
  +'<div class="mb-5 flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-emerald-500/40 bg-gradient-to-r from-emerald-600/20 via-emerald-500/10 to-amber-500/10 px-5 py-4 shadow-lg"><div class="flex items-center gap-3"><div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/30"><i data-lucide="check-circle-2" class="h-7 w-7"></i></div><div><div class="flex items-center gap-2"><span class="rounded-full bg-emerald-500 px-2.5 py-0.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-950">Booking Confirmed</span><span class="inline-flex items-center gap-1 text-xs font-bold text-amber-600 dark:text-amber-300"><i data-lucide="sparkles" class="h-3.5 w-3.5"></i> Faster than '+pct+'% of contenders!</span></div><h1 class="mt-1 text-lg font-extrabold text-slate-900 sm:text-xl dark:text-white">Congratulations! Your IRCTC e-Ticket is Generated.</h1></div></div><div class="flex items-center gap-3 font-mono"><div class="rounded-xl border border-emerald-500/30 bg-white/80 px-3.5 py-2 text-center dark:bg-slate-900/80"><p class="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400">Checkout Speed</p><p class="text-base font-extrabold text-emerald-600 dark:text-emerald-400">'+r.m.total.toFixed(1)+'s</p></div><div class="rounded-xl border border-amber-500/30 bg-white/80 px-3.5 py-2 text-center dark:bg-slate-900/80"><p class="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400">Hurdles Cleared</p><p class="text-base font-extrabold text-amber-600 dark:text-amber-400">'+(r.m.srv+1)+'</p></div></div></div>'
  +'<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl dark:border-slate-700/80 dark:bg-[#111b2d]"><div class="border-b-4 border-amber-500 bg-gradient-to-r from-[#1b365d] via-[#224578] to-[#1b365d] px-6 py-5 text-white"><div class="flex flex-wrap items-center justify-between gap-4"><div class="flex items-center gap-3"><i data-lucide="train-front" class="h-7 w-7 text-amber-400"></i><div><p class="text-[11px] font-bold uppercase tracking-widest text-amber-300">Indian Railways • Electronic Reservation Slip (ERS)</p><h2 class="text-lg font-extrabold tracking-tight sm:text-xl">'+r.train.no+' — '+esc(r.train.nm)+'</h2></div></div><div class="flex items-center gap-3 rounded-xl border border-amber-400/50 bg-[#0e203b] px-4 py-2.5"><div><p class="text-[10px] font-bold uppercase tracking-wider text-amber-300">10-Digit PNR Number</p><p class="font-mono text-xl font-extrabold tracking-widest text-white">'+r.pnr+'</p></div><button type="button" id="f-copy" class="btn-tactile rounded-lg bg-white/10 p-2 text-amber-300 hover:bg-white/20" title="Copy PNR"><i data-lucide="copy" class="h-4 w-4"></i></button></div></div></div>'
  +'<div class="p-5 sm:p-7 space-y-6"><div class="grid items-center gap-6 lg:grid-cols-12"><div class="space-y-4 lg:col-span-8"><div class="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-900/60"><div><p class="text-[10px] font-bold uppercase text-slate-400">Boarding From</p><p class="font-mono text-xl font-extrabold text-[#1b365d] dark:text-white">'+r.train.fc+' <span class="text-amber-500">'+r.train.dep+'</span></p><p class="text-xs font-semibold text-slate-600 dark:text-slate-300">'+esc(r.train.fn)+'</p></div><div class="flex flex-col items-center text-center"><span class="inline-flex items-center gap-1 font-mono text-xs font-bold text-slate-500 dark:text-slate-400"><i data-lucide="clock" class="h-3.5 w-3.5 text-amber-500"></i>'+r.train.dur+'</span><div class="my-1 h-[2px] w-24 bg-gradient-to-r from-amber-500 to-emerald-500"></div><span class="font-mono text-[10px] text-slate-400">'+r.train.km+' km</span></div><div class="text-right"><p class="text-[10px] font-bold uppercase text-slate-400">Destination</p><p class="font-mono text-xl font-extrabold text-[#1b365d] dark:text-white">'+r.train.tc+' <span class="text-emerald-500">'+r.train.arr+'</span></p><p class="text-xs font-semibold text-slate-600 dark:text-slate-300">'+esc(r.train.tn)+'</p></div></div>'
  +'<div class="grid grid-cols-2 gap-2.5 sm:grid-cols-4"><div class="rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><p class="text-[10px] font-bold uppercase text-slate-400">Journey Date</p><p class="font-mono text-xs font-extrabold text-slate-900 dark:text-white">'+esc(r.date)+'</p></div><div class="rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><p class="text-[10px] font-bold uppercase text-slate-400">Class</p><p class="font-mono text-xs font-extrabold text-slate-900 dark:text-white">'+r.cc+'</p></div><div class="rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><p class="text-[10px] font-bold uppercase text-slate-400">Quota</p><p class="text-xs font-extrabold text-amber-600 dark:text-amber-400">'+QUOTA[r.quota].label+'</p></div><div class="rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><p class="text-[10px] font-bold uppercase text-slate-400">TXN ID</p><p class="truncate font-mono text-xs font-bold text-slate-900 dark:text-white">'+esc(r.txn||'')+'</p></div></div></div>'
  +'<div class="flex flex-col items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 p-4 text-center lg:col-span-4 dark:border-slate-800 dark:bg-slate-900/60">'+qrSVG('PNR:'+r.pnr+'|TRN:'+r.train.no+'|DT:'+r.date+'|CLS:'+r.cc,132)+'<p class="mt-2 font-mono text-[11px] font-bold text-slate-600 dark:text-slate-300">Scan TTE Verification QR</p></div></div>'
  +'<div><h3 class="mb-2.5 text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">Passenger Status &amp; Berth Allocation</h3><div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800"><table class="w-full text-left text-xs"><thead class="bg-slate-100 text-[11px] font-extrabold uppercase text-slate-600 dark:bg-slate-800/80 dark:text-slate-300"><tr><th class="px-4 py-3">#</th><th class="px-4 py-3">Passenger Name</th><th class="px-4 py-3">Age / Sex</th><th class="px-4 py-3">Meal</th><th class="px-4 py-3">Current Status / Coach / Berth</th></tr></thead><tbody class="divide-y divide-slate-200 dark:divide-slate-800">'+rows+'</tbody></table></div></div>'
  +'<div class="grid gap-5 md:grid-cols-2"><div class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-xs space-y-2 dark:border-slate-800 dark:bg-slate-900/50"><h4 class="font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200">Official Fare Breakdown</h4><div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Ticket Fare ('+r.fare.n+' pax)</span><span class="font-mono font-bold">₹'+inr2(r.fare.sub)+'</span></div>'+(r.fare.tt>0?'<div class="flex justify-between text-amber-600 dark:text-amber-400"><span>Tatkal Charges</span><span class="font-mono font-bold">₹'+inr2(r.fare.tt)+'</span></div>':'')+'<div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Superfast + Reservation</span><span class="font-mono font-bold">₹'+inr2(r.fare.sr)+'</span></div><div class="flex justify-between text-slate-600 dark:text-slate-300"><span>IRCTC Convenience Fee + GST + Insurance</span><span class="font-mono font-bold">₹'+inr2(r.fare.conv+r.fare.gst+r.fare.ins)+'</span></div><div class="flex justify-between border-t border-slate-200 pt-2 text-sm font-extrabold text-slate-900 dark:border-slate-700 dark:text-white"><span>Total Paid ('+esc(r.method||'')+')</span><span class="font-mono text-emerald-600 dark:text-emerald-400">₹'+inr2(r.fare.grand)+'</span></div></div>'
  +'<div class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-xs space-y-2 dark:border-slate-800 dark:bg-slate-900/50"><h4 class="flex items-center gap-1.5 font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200"><i data-lucide="award" class="h-4 w-4 text-amber-500"></i> Tatkal Performance Breakdown</h4><div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Passenger Form + Captcha</span><span class="font-mono font-bold">'+r.m.pax.toFixed(1)+'s</span></div><div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Payment Gateway Handshake</span><span class="font-mono font-bold">'+r.m.pay.toFixed(1)+'s</span></div><div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Server Retries / Captcha Mistakes</span><span class="font-mono font-bold">'+r.m.srv+' / '+r.m.cap+'</span></div><div class="flex justify-between border-t border-slate-200 pt-2 font-extrabold text-slate-900 dark:border-slate-700 dark:text-white"><span>Total Checkout Time</span><span class="font-mono text-amber-600 dark:text-amber-400">'+r.m.total.toFixed(1)+'s</span></div></div></div>'
  +'<div class="flex flex-wrap gap-3 pt-2"><button type="button" id="f-dl" class="btn-tactile inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-[#1b365d] px-4 py-3 text-xs font-extrabold text-white shadow-md hover:bg-[#234578] sm:flex-none"><i data-lucide="download" class="h-4 w-4 text-amber-400"></i>Download e-Ticket (PNG)</button><button type="button" id="f-share" class="btn-tactile inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-3 text-xs font-extrabold text-slate-800 hover:bg-slate-50 sm:flex-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"><i data-lucide="share-2" class="h-4 w-4 text-amber-500"></i><span id="f-share-t">Share PNR</span></button><div class="flex flex-1 flex-wrap justify-end gap-2.5"><button type="button" id="f-again" class="btn-tactile inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-5 py-3 text-xs font-extrabold text-white shadow hover:bg-emerald-500"><i data-lucide="rotate-ccw" class="h-4 w-4"></i> Play Again</button>'+(S.difficulty!=='HARDCORE'?'<button type="button" id="f-hard" class="btn-tactile inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-red-600 to-orange-600 px-5 py-3 text-xs font-extrabold text-white shadow hover:brightness-110"><i data-lucide="flame" class="h-4 w-4"></i> Try Hardcore Mode</button>':'')+'</div></div>'
  +'</div></div></div>';
  refreshIcons();
  $('f-copy').onclick=async()=>{ Sound.click(); try{ await navigator.clipboard.writeText(r.pnr); toast('PNR '+r.pnr+' copied!'); }catch(e){ toast('PNR: '+r.pnr); } };
  $('f-dl').onclick=()=>{ Sound.click(); downloadTicket(r); };
  $('f-share').onclick=async()=>{ Sound.click(); const txt='IRCTC Tatkal Express e-Ticket\nPNR: '+r.pnr+'\nTrain: '+r.train.no+' '+r.train.nm+'\nRoute: '+r.train.fc+' ('+r.train.dep+') → '+r.train.tc+' ('+r.train.arr+')\nDate: '+r.date+' | Class: '+r.cc+' | Quota: '+r.quota+'\nStatus: '+(r.seats[0]?r.seats[0].st:'CNF')+'\nBooked in '+r.m.total.toFixed(1)+'s!';
    try{ if(navigator.share){ await navigator.share({title:'IRCTC PNR '+r.pnr,text:txt}); } else { await navigator.clipboard.writeText(txt); $('f-share-t').textContent='Copied PNR Summary!'; setTimeout(()=>{const t=$('f-share-t'); if(t) t.textContent='Share PNR';},2200); } }catch(e){ try{ await navigator.clipboard.writeText(txt); $('f-share-t').textContent='Copied PNR Summary!'; }catch(_){} } };
  $('f-again').onclick=()=>{ Sound.click(); S.slot=null; S.result=null; go('SEARCH'); };
  const fh=$('f-hard'); if(fh) fh.onclick=()=>{ Sound.click(); S.difficulty='HARDCORE'; S.slot=null; S.result=null; toast('Switched to HARDCORE Tatkal Chaos Mode! Good luck!'); go('SEARCH'); };
}

/* ================= MASTER LIST MODAL ================= */
function renderMasterModal(){
  const r=$('modal-root');
  const list=S.master.length===0?'<div class="rounded-xl border border-dashed border-slate-300 p-4 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">No passengers saved. Add one below for 1-click Tatkal auto-fill!</div>':'<div class="grid gap-2 sm:grid-cols-2">'+S.master.map(p=>'<div class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 dark:border-slate-700/70 dark:bg-slate-800/60"><div class="min-w-0"><p class="truncate text-sm font-bold text-slate-900 dark:text-white">'+esc(p.name)+'</p><p class="text-xs text-slate-500 dark:text-slate-400">'+p.age+' yrs • '+p.gender+' • '+esc(p.berth.replace('_',' '))+' • '+esc(p.food.replace('_',' '))+'</p></div><button type="button" data-del="'+p.id+'" class="mdel ml-2 rounded-lg p-1.5 text-red-500 hover:bg-red-500/10"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>').join('')+'</div>';
  r.innerHTML='<div class="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/70 backdrop-blur-sm sm:items-center sm:p-4"><div class="animate-slide-up w-full max-w-2xl overflow-hidden rounded-t-2xl border border-slate-200 bg-white shadow-2xl sm:rounded-2xl dark:border-slate-700/80 dark:bg-[#111b2d]"><div class="flex justify-center pt-2.5 sm:hidden"><div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-600"></div></div>'
  +'<div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 dark:border-slate-800"><div class="flex items-center gap-2.5"><div class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#1b365d] text-amber-400"><i data-lucide="user-check" class="h-5 w-5"></i></div><div><h2 class="text-base font-bold text-slate-900 dark:text-white">IRCTC Master Passenger List</h2><p class="text-xs text-slate-500 dark:text-slate-400">Save travellers beforehand for 1-click Tatkal auto-fill!</p></div></div><button type="button" id="mm-x" class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800"><i data-lucide="x" class="h-5 w-5"></i></button></div>'
  +'<div class="max-h-[74vh] overflow-y-auto p-5 space-y-5"><div class="space-y-2"><h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Saved Passengers ('+S.master.length+'/6)</h3>'+list+'</div>'
  +(S.master.length<6?'<form id="mm-form" class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 space-y-3 dark:border-slate-700/80 dark:bg-slate-900/50"><h3 class="text-xs font-bold uppercase tracking-wider text-[#1b365d] dark:text-amber-400">Add New Traveller</h3><div id="mm-err" class="hidden"></div><div class="grid grid-cols-1 gap-3 sm:grid-cols-3"><div class="sm:col-span-2"><label class="mb-1 block text-[11px] font-semibold text-slate-600 dark:text-slate-300">Full Name (as per ID)</label><input id="mm-name" type="text" placeholder="e.g. Vikramaditya Rao" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-amber-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white" /></div><div><label class="mb-1 block text-[11px] font-semibold text-slate-600 dark:text-slate-300">Age</label><input id="mm-age" type="number" min="1" max="110" value="28" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-mono text-slate-900 outline-none focus:border-amber-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white" /></div></div>'
  +'<div class="grid grid-cols-1 gap-3 sm:grid-cols-3"><div><label class="mb-1 block text-[11px] font-semibold text-slate-600 dark:text-slate-300">Gender</label><select id="mm-g" class="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-sm text-slate-900 outline-none focus:border-amber-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white"><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Transgender</option></select></div><div><label class="mb-1 block text-[11px] font-semibold text-slate-600 dark:text-slate-300">Berth Preference</label><select id="mm-b" class="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-sm text-slate-900 outline-none focus:border-amber-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white"><option value="NO_PREF">No Preference</option><option value="LOWER">Lower</option><option value="MIDDLE">Middle</option><option value="UPPER">Upper</option><option value="SIDE_LOWER">Side Lower</option><option value="SIDE_UPPER">Side Upper</option></select></div><div><label class="mb-1 block text-[11px] font-semibold text-slate-600 dark:text-slate-300">Food Choice</label><select id="mm-f" class="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-sm text-slate-900 outline-none focus:border-amber-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white"><option value="VEG">Veg Meal</option><option value="NON_VEG">Non-Veg Meal</option><option value="NO_FOOD">No Food</option></select></div></div>'
  +'<button type="submit" class="btn-tactile inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[#1b365d] px-4 py-2.5 text-sm font-bold text-white hover:bg-[#234578] dark:bg-amber-500 dark:text-slate-950 dark:hover:bg-amber-400"><i data-lucide="plus" class="h-4 w-4"></i> Save to Master List</button></form>':'')
  +'</div></div></div>';
  refreshIcons();
  $('mm-x').onclick=()=>{Sound.click();r.innerHTML='';};
  document.querySelectorAll('.mdel').forEach(b=>b.onclick=()=>{Sound.click();S.master=S.master.filter(x=>x.id!==b.getAttribute('data-del'));toast('Passenger removed from Master List.');renderMasterModal();renderTopbar();});
  const f=$('mm-form'); if(f) f.onsubmit=(e)=>{ e.preventDefault(); const nm=$('mm-name').value.trim(), ag=parseInt($('mm-age').value,10);
    const er=$('mm-err'); function eShow(t){ er.className='rounded-lg bg-red-500/10 px-3 py-1.5 text-xs font-semibold text-red-600 dark:text-red-400'; er.textContent=t; }
    er.className='hidden'; er.textContent='';
    if(nm.length<2){Sound.error();eShow('Enter passenger full name (min 2 characters).');return;}
    if(isNaN(ag)||ag<1||ag>110){Sound.error();eShow('Enter valid age between 1 and 110.');return;}
    Sound.click(); S.master.push({id:'mp-'+Date.now(),name:nm,age:ag,gender:$('mm-g').value,berth:$('mm-b').value,food:$('mm-f').value});
    toast(nm+' added to Master List!'); renderMasterModal(); renderTopbar(); };
}

/* ================= ABANDON MODAL ================= */
function renderAbandon(){
  const r=$('modal-root');
  r.innerHTML='<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/75 p-4 backdrop-blur-sm"><div class="animate-pop-in w-full max-w-sm rounded-2xl border border-amber-500/40 bg-white p-5 shadow-2xl dark:bg-[#111b2d]"><div class="flex items-center gap-2.5 text-amber-500"><i data-lucide="alert-triangle" class="h-6 w-6 shrink-0"></i><h3 class="text-base font-extrabold text-slate-900 dark:text-white">Abandon Active Booking?</h3></div><p class="mt-2.5 text-xs leading-relaxed text-slate-600 dark:text-slate-300">Leaving this screen will immediately release your locked Tatkal berth slot and cancel the active checkout timer. Are you sure?</p><div class="mt-5 flex gap-2.5"><button type="button" id="ab-stay" class="btn-tactile flex-1 rounded-xl border border-slate-300 px-3 py-2.5 text-xs font-bold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Stay &amp; Finish</button><button type="button" id="ab-go" class="btn-tactile flex-1 rounded-xl bg-red-600 px-3 py-2.5 text-xs font-extrabold text-white hover:bg-red-500">Release Slot</button></div></div></div>';
  refreshIcons();
  $('ab-stay').onclick=()=>{Sound.click();S.abandonTo=null;r.innerHTML='';};
  $('ab-go').onclick=()=>{Sound.click();const t=S.abandonTo;S.abandonTo=null;r.innerHTML='';if(t==='LOGIN')S.loggedIn=false;go(t||'SEARCH');};
}

/* ================= MASTER RENDER ================= */
function render(){ applyTheme(); renderTopbar(); $('modal-root').innerHTML='';
  if(S.screen==='LOGIN') renderA();
  else if(S.screen==='SEARCH') renderB();
  else if(S.screen==='TRAINS') renderC();
  else if(S.screen==='PASSENGER'){ if(!S.slot){go('SEARCH');return;} renderD(); }
  else if(S.screen==='PAYMENT'){ if(!S.slot||!S.fare){go('SEARCH');return;} renderE(); }
  else if(S.screen==='RESULT') renderF();
  refreshIcons();
}
document.addEventListener('DOMContentLoaded',()=>{ applyTheme(); render(); });
</script>
